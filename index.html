<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>理学ボディ YouTube</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #f7f7f7;
    }
    .container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      padding: 16px;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      text-decoration: none;
      color: #222;
    }
    .card img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
    }
    .card-title {
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h1>表示テスト OK</h1>
  <div class="container" id="videos"></div>

  <script>
    const RSS_URL =
      "https://www.youtube.com/feeds/videos.xml?channel_id=UCqbGz4MmKikm10uMuoGI45Q";
    const CORS_PROXY = "https://api.allorigins.win/raw?url=";

    fetch(CORS_PROXY + encodeURIComponent(RSS_URL))
      .then(res => res.text())
      .then(xmlText => {
        const parser = new DOMParser();
        const xml = parser.parseFromString(xmlText, "text/xml");
        const entries = Array.from(xml.getElementsByTagName("entry")).slice(0, 3);

        const container = document.getElementById("videos");

        entries.forEach(entry => {
          const title = entry.getElementsByTagName("title")[0].textContent;
          const link = entry.getElementsByTagName("link")[0].getAttribute("href");
          const videoId = entry
            .getElementsByTagName("yt:videoId")[0]
            .textContent;

          const thumbnail = `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`;

          const a = document.createElement("a");
          a.className = "card";
          a.href = link;
          a.target = "_blank";
          a.rel = "noopener";

          a.innerHTML = `
            <img src="${thumbnail}" alt="">
            <div class="card-title">${title}</div>
          `;

          container.appendChild(a);
        });
      })
      .catch(err => {
        console.error(err);
        document.getElementById("videos").innerText =
          "動画を読み込めませんでした";
      });
  </script>
</body>
</html>
